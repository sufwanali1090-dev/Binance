name: Binance Live Arbitrage Signals

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: live-arbitrage-scanner
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start live signal scanner
        env:
          STARTING_AMOUNT: "100"
          FEE_RATE: "0.001"
          MIN_NET_PROFIT_PERCENT: "0.05"
          MIN_NET_PROFIT_USDT: "0.01"
          MAX_ROUTES: "10000"
        run: |
          python -u src/main.py

      - name: Upload signal data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-signals
          path: data/
          retention-days: 7
