- name: Find and run LIVE signal scanner
  env:
    STARTING_AMOUNT: "100"
    FEE_RATE: "0.001"
    MIN_NET_PROFIT_PERCENT: "0.05"
    MIN_NET_PROFIT_USDT: "0.01"
  run: |
    echo "Repository contents:"
    find . -maxdepth 4 -type f | sort

    MAIN=$(find . -type f -path "*/src/main.py" | head -n 1)

    if [ -z "$MAIN" ]; then
      echo "ERROR: src/main.py was not found."
      exit 1
    fi

    echo "Starting scanner: $MAIN"
    cd "$(dirname "$MAIN")/.."
    python -u src/main.py
